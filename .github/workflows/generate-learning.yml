name: Generate Learning Index

on:
    push:
        branches:
            - main
        paths:
            - "learnings/**/*.md"
            - "Recommendations/**/*.md"
            - ".github/workflows/generate-learning.yml"

    workflow_dispatch:

permissions:
    contents: write

jobs:
    generate-learning:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Generate learning indexes
              shell: python
              run: |

                  import json
                  from pathlib import Path


                  def parse_frontmatter(content):

                      metadata = {}

                      if not content.startswith("---"):
                          return metadata

                      parts = content.split("---", 2)

                      if len(parts) < 3:
                          return metadata

                      frontmatter = parts[1]

                      for line in frontmatter.splitlines():

                          line = line.strip()

                          if not line or ":" not in line:
                              continue

                          key, value = line.split(":", 1)

                          key = key.strip()
                          value = value.strip()

                          if (
                              len(value) >= 2
                              and value[0] == value[-1]
                              and value[0] in ("'", '"')
                          ):
                              value = value[1:-1]

                          metadata[key] = value

                      return metadata


                  def get_title(content, path):

                      metadata = parse_frontmatter(content)

                      if metadata.get("title"):
                          return metadata["title"]

                      for line in content.splitlines():

                          if line.startswith("# "):
                              return line[2:].strip()

                      return path.stem.replace("-", " ").title()


                  def create_entry(path, content_type):
                      content = path.read_text(encoding="utf-8")
                      metadata = parse_frontmatter(content)
                      entry = {
                          "title": get_title(content, path),
                          "date": metadata.get("date", ""),
                          "file": str(path).replace("\\", "/"),
                          "author": metadata.get("author", "")
                      }
                      if content_type == "book":
                          entry["chapter"] = metadata.get("chapter", "")
                      return entry


                  def generate(directory, content_type):

                      directory = Path(directory)

                      if not directory.exists():
                          return []

                      result = []

                      for path in sorted(
                          directory.rglob("*.md")
                      ):

                          result.append(
                              create_entry(
                                  path,
                                  content_type
                              )
                          )

                      result.sort(
                          key=lambda item: item.get(
                              "date",
                              ""
                          ),
                          reverse=True
                      )

                      return result


                  books = generate(
                      "learnings/books",
                      "book"
                  )

                  articles = generate(
                      "learnings/articles",
                      "article"
                  )

                  # ============================================
                  # RECOMMENDATIONS – fixed case & image lookup
                  # ============================================
                  def generate_recommendations():
                      # Use the exact folder name (capital R)
                      base = Path("Recommendations")
                      if not base.exists():
                          return []

                      result = []
                      # Each subfolder is a person
                      for person_dir in base.iterdir():
                          if not person_dir.is_dir():
                              continue
                          md_file = person_dir / "recommendation.md"
                          if not md_file.exists():
                              continue

                          content = md_file.read_text(encoding="utf-8")
                          metadata = parse_frontmatter(content)

                          # Extract the recommendation text (after frontmatter)
                          parts = content.split("---", 2)
                          text = parts[2].strip() if len(parts) >= 3 else content.strip()

                          # Look for an image in the person's folder
                          image_path = ""
                          # First check if metadata has an image key
                          if metadata.get("image"):
                              # If the path is given, use it as-is (relative to repo root)
                              image_path = metadata["image"]
                          else:
                              # Otherwise, try to find any image file
                              for ext in [".jpeg", ".jpg", ".png", ".gif"]:
                                  img = person_dir / f"image{ext}"
                                  if img.exists():
                                      image_path = str(img).replace("\\", "/")
                                      break
                              else:
                                  # fallback to a generic placeholder (empty string)
                                  image_path = ""

                          result.append({
                              "author": metadata.get("author", person_dir.name),
                              "image": image_path,
                              "text": text,
                              "folder": str(person_dir.name)
                          })

                      return result


                  recommendations = generate_recommendations()

                  # Write all JSON files
                  data_directory = Path("data")
                  data_directory.mkdir(parents=True, exist_ok=True)

                  Path("data/books.json").write_text(
                      json.dumps(books, indent=4, ensure_ascii=False) + "\n",
                      encoding="utf-8"
                  )

                  Path("data/articles.json").write_text(
                      json.dumps(articles, indent=4, ensure_ascii=False) + "\n",
                      encoding="utf-8"
                  )

                  Path("data/recommendations.json").write_text(
                      json.dumps(recommendations, indent=4, ensure_ascii=False) + "\n",
                      encoding="utf-8"
                  )

                  print(f"Generated {len(books)} books.")
                  print(f"Generated {len(articles)} articles.")
                  print(f"Generated {len(recommendations)} recommendations.")

            - name: Commit generated indexes
              run: |

                  git config user.name "github-actions[bot]"

                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add data/books.json data/articles.json data/recommendations.json

                  if git diff --cached --quiet; then
                    echo "No changes to commit."
                    exit 0
                  fi

                  git commit \
                    -m "chore: update learning indexes"

                  git push
