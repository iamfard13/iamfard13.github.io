<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ali Abbasifard — Learning">
    <title>Learning | Ali Abbasifard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         ANIMATED BACKGROUND – PARTICLE NETWORK
         ===================================================== -->
    <canvas id="bgCanvas"></canvas>

    <!-- =====================================================
         NAVIGATION
         ===================================================== -->
    <header class="navbar">
        <nav class="navbar-links">
            <a href="index.html#skills">Skills</a>
            <a href="index.html#projects">Projects</a>
            <a href="learning.html" class="active">Learning</a>
            <a href="index.html#recommendations">Recommendations</a>
            <a href="index.html#contact">Contact</a>
        </nav>
    </header>

    <main>
        <!-- =================================================
             TOPICS – card with share button
             ================================================= -->
        <section class="section learning-topics-section">
            <div class="section-header">
                <h2>Topics I'm exploring.</h2>
            </div>

            <div class="learning-grid">
                <!-- Topic 1 – Book: Parallel Programming -->
                <article class="learning-topic-card" data-href="learning-viewer.html?topic=parallel-programming">
                    <span class="learning-topic-number">01</span>
                    <p class="learning-topic-label">BOOK</p>
                    <h3>Is Parallel Programming Hard, And, If So, What Can You Do About It?</h3>
                    <p class="learning-topic-author">by Paul E. McKenney</p>
                    <span class="learning-topic-read-time"><i class="fas fa-clock"></i> 6 min read</span>

                    <!-- SHARE BUTTON -->
                    <button class="share-button" data-topic="parallel-programming" aria-label="Share this article">
                        <i class="fas fa-share-alt"></i>
                        <span class="share-tooltip">Copy link</span>
                    </button>
                </article>
                <!-- other cards would have similar share buttons -->
            </div>
        </section>

        <!-- =================================================
             BACK TO HOME
             ================================================= -->
        <div style="text-align:center; margin: 20px 0 60px;">
            <a href="index.html"
                style="font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.3; letter-spacing: 0.1em; transition: opacity 0.2s; text-transform: uppercase;">
                ← Back to Home
            </a>
        </div>
    </main>

    <!-- =====================================================
         FOOTER
         ===================================================== -->
    <footer class="footer">
        <p>© 2026 Ali Abbasifard</p>
        <p>Built with curiosity &amp; code.</p>
    </footer>

    <!-- Main JavaScript -->
    <script src="script.js"></script>
    <!-- Background particle network -->
    <script src="particles.js"></script>

    <!-- =====================================================
         SHARE + CARD CLICK HANDLERS
         ===================================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            // ---- Card click: navigate to article ----
            document.querySelectorAll('.learning-topic-card').forEach(card => {
                card.addEventListener('click', function (e) {
                    // Ignore if click was on the share button or its children
                    if (e.target.closest('.share-button')) return;
                    const href = this.dataset.href;
                    if (href) {
                        window.location.href = href;
                    }
                });
            });

            // ---- Share button ----
            document.querySelectorAll('.share-button').forEach(btn => {
                btn.addEventListener('click', function (e) {
                    e.stopPropagation(); // prevent card navigation
                    const topic = this.dataset.topic;
                    const url = new URL(window.location.href);
                    // Build the full URL to the viewer page with the topic
                    const viewerUrl = `${url.origin}${url.pathname.replace(/\/[^/]*$/, '/')}learning-viewer.html?topic=${topic}`;

                    // Use Web Share API if available (mobile)
                    if (navigator.share) {
                        navigator.share({
                            title: document.querySelector('.learning-topic-card h3')?.textContent || 'Learning note',
                            text: 'Check out this learning note:',
                            url: viewerUrl
                        }).catch(() => { });
                    } else {
                        // Fallback: copy to clipboard
                        navigator.clipboard.writeText(viewerUrl).then(() => {
                            const tooltip = this.querySelector('.share-tooltip');
                            const originalText = tooltip.textContent;
                            tooltip.textContent = 'Copied!';
                            setTimeout(() => {
                                tooltip.textContent = originalText;
                            }, 2000);
                        }).catch(() => {
                            // Fallback: prompt user
                            prompt('Copy this link to share:', viewerUrl);
                        });
                    }
                });
            });
        });
    </script>
</body>

</html>
