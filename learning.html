<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ali Abbasifard — Learning">
    <title>Learning | Ali Abbasifard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         ANIMATED BACKGROUND
         ===================================================== -->
    <canvas id="bgCanvas"></canvas>

    <!-- =====================================================
         NAVIGATION
         ===================================================== -->
    <header class="navbar">
        <nav class="navbar-links">
            <a href="index.html#skills">Skills</a>
            <a href="index.html#projects">Projects</a>
            <a href="learning.html" class="active">Learning</a>
            <a href="index.html#recommendations">Recommendations</a>
            <a href="index.html#contact">Contact</a>
        </nav>
    </header>

    <main>
        <!-- =================================================
             ARTICLES – dynamically loaded from JSON
             ================================================= -->
        <section class="section learning-topics-section">
            <div class="section-header">
                <h2>Topics I'm exploring.</h2>
            </div>

            <div id="articles-grid" class="learning-grid"></div>
        </section>

        <!-- =================================================
             BACK TO HOME
             ================================================= -->
        <div style="text-align:center; margin: 20px 0 60px;">
            <a href="index.html"
                style="font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.3; letter-spacing: 0.1em; transition: opacity 0.2s; text-transform: uppercase;">
                ← Back to Home
            </a>
        </div>
    </main>

    <!-- =====================================================
         FOOTER
         ===================================================== -->
    <footer class="footer">
        <p>© 2026 Ali Abbasifard</p>
        <p>Built with curiosity &amp; code.</p>
    </footer>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script src="particles.js"></script>

    <!-- =====================================================
         DYNAMIC CARD LOADER (only articles)
         ===================================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const GITHUB_OWNER = 'iamfard13';
            const GITHUB_REPO = 'iamfard13.github.io';
            const BRANCH = 'main';

            const grid = document.getElementById('articles-grid');
            if (!grid) return;

            loadArticles();

            async function loadArticles() {
                try {
                    const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${BRANCH}/data/articles.json`;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const items = await response.json();

                    if (items.length === 0) {
                        grid.innerHTML = `<p style="opacity:0.4; font-size:14px;">No articles yet.</p>`;
                        return;
                    }

                    grid.innerHTML = '';

                    // For each article, we need to fetch the markdown to compute read time
                    for (let index = 0; index < items.length; index++) {
                        const item = items[index];
                        const card = await createCard(item, index);
                        grid.appendChild(card);
                    }
                } catch (error) {
                    console.error('Error loading articles:', error);
                    grid.innerHTML = `<p style="opacity:0.4; font-size:14px;">Unable to load articles.</p>`;
                }
            }

            async function createCard(item, index) {
                const card = document.createElement('article');
                card.className = 'learning-topic-card';

                // Determine the file name without extension for the viewer URL
                const filePath = item.file;
                const viewerUrl = `learning-viewer.html?file=${encodeURIComponent(filePath)}`;
                card.dataset.href = viewerUrl;

                // ---- Number ----
                const number = document.createElement('span');
                number.className = 'learning-topic-number';
                number.textContent = String(index + 1).padStart(2, '0');
                card.appendChild(number);

                // ---- Label (we'll show "BOOK" or "ARTICLE" based on folder) ----
                const label = document.createElement('p');
                label.className = 'learning-topic-label';
                // Check if the file is in 'books' or 'articles' folder
                const folder = filePath.includes('/books/') ? 'BOOK' : 'ARTICLE';
                label.textContent = folder;
                card.appendChild(label);

                // ---- Title ----
                const title = document.createElement('h3');
                title.textContent = item.title || filePath.replace(/^.*\//, '').replace(/\.md$/, '').replace(/-/g, ' ');
                card.appendChild(title);

                // ---- Author ----
                if (item.author) {
                    const author = document.createElement('p');
                    author.className = 'learning-topic-author';
                    author.textContent = `by ${item.author}`;
                    card.appendChild(author);
                }

                // ---- Chapter (optional) ----
                if (item.chapter) {
                    const chapter = document.createElement('p');
                    chapter.className = 'learning-topic-author';
                    chapter.textContent = item.chapter;
                    chapter.style.fontStyle = 'italic';
                    chapter.style.opacity = '0.3';
                    card.appendChild(chapter);
                }

                // ---- Read Time (auto-computed) ----
                const readTimeSpan = document.createElement('span');
                readTimeSpan.className = 'learning-topic-read-time';

                try {
                    // Fetch the raw markdown to count words
                    const rawUrl = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${BRANCH}/${filePath}`;
                    const mdResponse = await fetch(rawUrl);
                    if (mdResponse.ok) {
                        const md = await mdResponse.text();
                        // Remove frontmatter if any
                        const contentWithoutFrontmatter = md.replace(/^---[\s\S]*?---/, '').trim();
                        // Count words (split by spaces and filter out empty)
                        const words = contentWithoutFrontmatter.split(/\s+/).filter(w => w.length > 0).length;
                        const readTime = Math.ceil(words / 200); // average reading speed
                        readTimeSpan.innerHTML = `<i class="fas fa-clock"></i> ${readTime} min read`;
                    } else {
                        readTimeSpan.innerHTML = `<i class="fas fa-clock"></i> ~2 min read`; // fallback
                    }
                } catch {
                    readTimeSpan.innerHTML = `<i class="fas fa-clock"></i> ~2 min read`;
                }
                card.appendChild(readTimeSpan);

                // ---- Share Dropdown ----
                const dropdown = document.createElement('div');
                dropdown.className = 'share-dropdown';

                const shareBtn = document.createElement('button');
                shareBtn.className = 'share-button';
                shareBtn.setAttribute('aria-label', 'Share options');
                shareBtn.innerHTML = '<i class="fas fa-share-alt"></i>';
                dropdown.appendChild(shareBtn);

                const menu = document.createElement('div');
                menu.className = 'share-dropdown-menu';

                // Share native
                const shareNative = document.createElement('button');
                shareNative.className = 'share-option share-native';
                shareNative.dataset.file = filePath;
                shareNative.innerHTML = '<i class="fas fa-share-nodes"></i> Share';
                menu.appendChild(shareNative);

                // Copy link
                const shareCopy = document.createElement('button');
                shareCopy.className = 'share-option share-copy';
                shareCopy.dataset.file = filePath;
                shareCopy.innerHTML = '<i class="fas fa-copy"></i> Copy Link';
                menu.appendChild(shareCopy);

                dropdown.appendChild(menu);
                card.appendChild(dropdown);

                // ----- Event Listeners -----
                // Card click (navigate)
                card.addEventListener('click', function (e) {
                    if (e.target.closest('.share-dropdown')) return;
                    const href = this.dataset.href;
                    if (href) window.location.href = href;
                });

                // Toggle dropdown
                shareBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const isOpen = menu.classList.contains('open');
                    document.querySelectorAll('.share-dropdown-menu.open').forEach(m => m.classList.remove('open'));
                    if (!isOpen) menu.classList.add('open');
                });

                // Share native
                shareNative.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const file = this.dataset.file;
                    const url = buildViewerUrl(file);
                    if (navigator.share) {
                        navigator.share({ title: item.title || 'Learning note', url }).catch(() => { });
                    } else {
                        copyToClipboard(url, this);
                    }
                    closeAllDropdowns();
                });

                // Copy link
                shareCopy.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const file = this.dataset.file;
                    const url = buildViewerUrl(file);
                    copyToClipboard(url, this);
                    closeAllDropdowns();
                });

                return card;
            }

            // ---- Helpers ----
            function buildViewerUrl(file) {
                const base = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/');
                return `${base}learning-viewer.html?file=${encodeURIComponent(file)}`;
            }

            function copyToClipboard(text, element) {
                navigator.clipboard.writeText(text).then(() => {
                    const orig = element.textContent;
                    element.textContent = 'Copied!';
                    setTimeout(() => { element.textContent = orig; }, 1500);
                }).catch(() => {
                    prompt('Copy this link:', text);
                });
            }

            function closeAllDropdowns() {
                document.querySelectorAll('.share-dropdown-menu.open').forEach(m => m.classList.remove('open'));
            }

            // Close dropdowns on outside click
            document.addEventListener('click', function () {
                closeAllDropdowns();
            });
        });
    </script>
</body>

</html>
