<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ali Abbasifard — Learning">
    <title>Learning | Ali Abbasifard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         ANIMATED BACKGROUND
         ===================================================== -->
    <canvas id="bgCanvas"></canvas>

    <!-- =====================================================
         NAVIGATION
         ===================================================== -->
    <header class="navbar">
        <nav class="navbar-links">
            <a href="index.html#skills">Skills</a>
            <a href="index.html#projects">Projects</a>
            <a href="learning.html" class="active">Learning</a>
            <a href="index.html#recommendations">Recommendations</a>
            <a href="index.html#contact">Contact</a>
        </nav>
    </header>

    <main>
        <!-- =================================================
             TOPICS – card with share dropdown
             ================================================= -->
        <section class="section learning-topics-section">
            <div class="section-header">
                <h2>Topics I'm exploring.</h2>
            </div>

            <div class="learning-grid">
                <!-- Topic 1 – Book: Parallel Programming -->
                <article class="learning-topic-card" data-href="learning-viewer.html?topic=parallel-programming">
                    <span class="learning-topic-number">01</span>
                    <p class="learning-topic-label">BOOK</p>
                    <h3>Is Parallel Programming Hard, And, If So, What Can You Do About It?</h3>
                    <p class="learning-topic-author">by Paul E. McKenney</p>
                    <span class="learning-topic-read-time"><i class="fas fa-clock"></i> 6 min read</span>

                    <!-- SHARE DROPDOWN -->
                    <div class="share-dropdown">
                        <button class="share-button" aria-label="Share options">
                            <i class="fas fa-share-alt"></i>
                        </button>
                        <div class="share-dropdown-menu">
                            <button class="share-option share-native" data-topic="parallel-programming">
                                <i class="fas fa-share-nodes"></i> Share
                            </button>
                            <button class="share-option share-copy" data-topic="parallel-programming">
                                <i class="fas fa-copy"></i> Copy Link
                            </button>
                        </div>
                    </div>
                </article>
                <!-- Add more cards with similar dropdown if needed -->
            </div>
        </section>

        <!-- =================================================
             BACK TO HOME
             ================================================= -->
        <div style="text-align:center; margin: 20px 0 60px;">
            <a href="index.html"
                style="font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.3; letter-spacing: 0.1em; transition: opacity 0.2s; text-transform: uppercase;">
                ← Back to Home
            </a>
        </div>
    </main>

    <!-- =====================================================
         FOOTER
         ===================================================== -->
    <footer class="footer">
        <p>© 2026 Ali Abbasifard</p>
        <p>Built with curiosity &amp; code.</p>
    </footer>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script src="particles.js"></script>

    <!-- =====================================================
         DROPDOWN + SHARE LOGIC
         ===================================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            // ---- Card click: navigate ----
            document.querySelectorAll('.learning-topic-card').forEach(card => {
                card.addEventListener('click', function (e) {
                    if (e.target.closest('.share-dropdown')) return;
                    const href = this.dataset.href;
                    if (href) window.location.href = href;
                });
            });

            // ---- Toggle dropdown ----
            document.querySelectorAll('.share-button').forEach(btn => {
                btn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const dropdown = this.closest('.share-dropdown');
                    const menu = dropdown.querySelector('.share-dropdown-menu');
                    const isOpen = menu.classList.contains('open');
                    // Close all others
                    document.querySelectorAll('.share-dropdown-menu.open').forEach(m => m.classList.remove('open'));
                    if (!isOpen) menu.classList.add('open');
                });
            });

            // ---- Close dropdown when clicking outside ----
            document.addEventListener('click', function () {
                document.querySelectorAll('.share-dropdown-menu.open').forEach(m => m.classList.remove('open'));
            });

            // ---- Share via native ----
            document.querySelectorAll('.share-native').forEach(btn => {
                btn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const topic = this.dataset.topic;
                    const url = buildViewerUrl(topic);
                    if (navigator.share) {
                        navigator.share({
                            title: 'Learning note',
                            text: 'Check out this learning note:',
                            url: url
                        }).catch(() => { });
                    } else {
                        // Fallback: copy
                        copyToClipboard(url, this);
                    }
                    closeAllDropdowns();
                });
            });

            // ---- Copy link ----
            document.querySelectorAll('.share-copy').forEach(btn => {
                btn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const topic = this.dataset.topic;
                    const url = buildViewerUrl(topic);
                    copyToClipboard(url, this);
                    closeAllDropdowns();
                });
            });

            // ---- Helpers ----
            function buildViewerUrl(topic) {
                const url = new URL(window.location.href);
                const base = url.origin + url.pathname.replace(/\/[^/]*$/, '/');
                return `${base}learning-viewer.html?topic=${topic}`;
            }

            function copyToClipboard(text, element) {
                navigator.clipboard.writeText(text).then(() => {
                    showFeedback(element, 'Copied!');
                }).catch(() => {
                    prompt('Copy this link:', text);
                });
            }

            function showFeedback(element, msg) {
                const orig = element.textContent;
                element.textContent = msg;
                setTimeout(() => { element.textContent = orig; }, 1500);
            }

            function closeAllDropdowns() {
                document.querySelectorAll('.share-dropdown-menu.open').forEach(m => m.classList.remove('open'));
            }
        });
    </script>
</body>

</html>
