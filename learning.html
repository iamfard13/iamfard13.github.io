    <!-- Font Awesome -->

    <!-- Main CSS -->

<body>

    <canvas id="bgCanvas"></canvas>

    <header class="navbar">
        <nav class="navbar-links">
            <a href="index.html#companies">Companies</a>
            <a href="index.html#skills">Skills</a>
            <a href="index.html#projects">Projects</a>
            <a href="learning.html" class="active">Learning</a>
            <a href="index.html#recommendations">Recommendations</a>
            <a href="index.html#contact">Contact</a>

            <!-- View CV button -->
            <a href="Ali_Abbasifard_Resume.pdf" target="_blank" rel="noopener noreferrer" class="resume-btn">
                <i class="fas fa-file-pdf"></i> View CV
            </a>
        </nav>
    </header>

    <main>
        <section class="section learning-topics-section">
            <div class="section-header">
                <h2>Topics I'm exploring.</h2>
            </div>

            <!-- Search & Filter Controls -->
            <div class="filter-controls">
                <div class="search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="search-input" placeholder="Search by title, chapter, or author..."
                        class="search-input">
                </div>

                <div class="date-filter-wrapper">
                    <div class="date-input-group">
                        <label for="date-from">From</label>
                        <input type="date" id="date-from" class="date-input">
                    </div>
                    <div class="date-input-group">
                        <label for="date-to">To</label>
                        <input type="date" id="date-to" class="date-input">
                    </div>
                </div>

                <button id="clear-filters" class="clear-filters-btn">
                    <i class="fas fa-undo-alt"></i> Reset
                </button>
            </div>

            <!-- Result count -->
            <div id="result-count" class="result-count"></div>

            <!-- Combined grid -->
            <div id="learning-grid" class="learning-grid"></div>

            <!-- Fallback -->
            <div id="empty-message" style="display:none; opacity:0.4; text-align:center; padding:40px 0;">
                No learning content yet. Check back soon!
            </div>
        </section>

        <div style="text-align:center; margin: 20px 0 60px;">
            <a href="index.html"
                style="font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.3; letter-spacing: 0.1em; transition: opacity 0.2s; text-transform: uppercase;">
                ← Back to Home
            </a>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Ali Abbasifard</p>
        <p>Built with curiosity &amp; code.</p>
    </footer>

    <script src="script.js"></script>
    <script src="particles.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const GITHUB_OWNER = 'iamfard13';
            const GITHUB_REPO = 'iamfard13.github.io';
            const BRANCH = 'main';

            const grid = document.getElementById('learning-grid');
            const emptyMessage = document.getElementById('empty-message');
            const searchInput = document.getElementById('search-input');
            const dateFrom = document.getElementById('date-from');
            const dateTo = document.getElementById('date-to');
            const clearBtn = document.getElementById('clear-filters');
            const resultCount = document.getElementById('result-count');

            let allItems = [];
            let filteredItems = [];

            // Parse date string like "August 29, 2026" -> local midnight Date
            function parseDate(dateStr) {
                if (!dateStr) return null;
                const parts = dateStr.split(',').map(s => s.trim());
                if (parts.length === 2) {
                    const monthDay = parts[0].split(' ');
                    const month = monthDay[0];
                    const day = parseInt(monthDay[1], 10);
                    const year = parseInt(parts[1], 10);
                    if (month && !isNaN(day) && !isNaN(year)) {
                        const monthIndex = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'].indexOf(month);
                        if (monthIndex !== -1) {
                            return new Date(year, monthIndex, day); // local midnight
                        }
                    }
                }
                // Fallback: try generic
                const d = new Date(dateStr);
                return isNaN(d.getTime()) ? null : d;
            }

            // Fetch data
            const urls = [
                `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${BRANCH}/data/books.json`,
                `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${BRANCH}/data/articles.json`
            ];

            Promise.all(urls.map(url => fetch(url).then(res => {
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            })))
                .then(([books, articles]) => {
                    allItems = [
                        ...books.map(item => ({ ...item, type: 'BOOK' })),
                        ...articles.map(item => ({ ...item, type: 'ARTICLE' }))
                    ];

                    if (allItems.length === 0) {
                        emptyMessage.style.display = 'block';
                        return;
                    }

                    // Sort by date (newest first)
                    allItems.sort((a, b) => {
                        const dateA = a.date ? new Date(a.date) : new Date(0);
                        const dateB = b.date ? new Date(b.date) : new Date(0);
                        return dateB - dateA;
                    });

                    applyFilters(); // initial render

                    // Event listeners
                    searchInput.addEventListener('input', applyFilters);
                    dateFrom.addEventListener('change', applyFilters);
                    dateTo.addEventListener('change', applyFilters);
                    clearBtn.addEventListener('click', resetFilters);

                    emptyMessage.style.display = 'none';
                })
                .catch(error => {
                    console.error('Error loading learning content:', error);
                    emptyMessage.style.display = 'block';
                    emptyMessage.textContent = 'Unable to load learning content. Please try again later.';
                });

            // ----- Filtering logic (fixed date parsing) -----
            function applyFilters() {
                const searchTerm = searchInput.value.toLowerCase().trim();

                // Parse dates as LOCAL midnight/end-of-day
                const fromDate = dateFrom.value ? new Date(dateFrom.value + 'T00:00:00') : null;
                const toDate = dateTo.value ? new Date(dateTo.value + 'T23:59:59') : null;

                filteredItems = allItems.filter(item => {
                    // Search in title, chapter (if exists), author
                    let matchesSearch = true;
                    if (searchTerm) {
                        const titleMatch = item.title.toLowerCase().includes(searchTerm);
                        const chapterMatch = item.chapter ? item.chapter.toLowerCase().includes(searchTerm) : false;
                        const authorMatch = item.author ? item.author.toLowerCase().includes(searchTerm) : false;
                        matchesSearch = titleMatch || chapterMatch || authorMatch;
                    }

                    // Date range
                    let matchesDate = true;
                    if (fromDate || toDate) {
                        const itemDate = parseDate(item.date);
                        if (itemDate) {
                            if (fromDate && itemDate < fromDate) matchesDate = false;
                            if (toDate && itemDate > toDate) matchesDate = false;
                        } else {
                            // If item has no valid date, exclude if range is set
                            matchesDate = false;
                        }
                    }

                    return matchesSearch && matchesDate;
                });

                renderGrid();
                updateResultCount();
            }

            function resetFilters() {
                searchInput.value = '';
                dateFrom.value = '';
                dateTo.value = '';
                applyFilters();
            }

            function renderGrid() {
                grid.innerHTML = '';
                if (filteredItems.length === 0) {
                    emptyMessage.style.display = 'block';
                    emptyMessage.textContent = 'No items match your filters.';
                    return;
                }
                emptyMessage.style.display = 'none';

                filteredItems.forEach((item, index) => {
                    const card = createCard(item, index);
                    grid.appendChild(card);
                });
            }

            function updateResultCount() {
                const total = allItems.length;
                const shown = filteredItems.length;
                resultCount.textContent = `Showing ${shown} of ${total} item${total > 1 ? 's' : ''}`;
            }

            // ----- Card creation (unchanged) -----
            function createCard(item, index) {
                const card = document.createElement('article');
                card.className = 'learning-topic-card';

                const filePath = item.file;
                const viewerUrl = `learning-viewer.html?file=${encodeURIComponent(filePath)}`;
                card.dataset.href = viewerUrl;

                const number = document.createElement('span');
                number.className = 'learning-topic-number';
                number.textContent = String(index + 1).padStart(2, '0');
                card.appendChild(number);

                const labelEl = document.createElement('p');
                labelEl.className = 'learning-topic-label';
                labelEl.textContent = item.type;
                card.appendChild(labelEl);

                const title = document.createElement('h3');
                title.textContent = item.title || filePath.replace(/^.*\//, '').replace(/\.md$/, '').replace(/-/g, ' ');
                card.appendChild(title);

                if (item.chapter) {
                    const chapter = document.createElement('p');
                    chapter.className = 'learning-topic-chapter';
                    chapter.textContent = item.chapter;
                    card.appendChild(chapter);
                }

                if (item.author) {
                    const author = document.createElement('p');
                    author.className = 'learning-topic-author';
                    author.innerHTML = `<i class="fas fa-user"></i> by ${item.author}`;
                    card.appendChild(author);
                }

                if (item.date) {
                    const date = document.createElement('p');
                    date.className = 'learning-topic-date';
                    date.innerHTML = `<i class="fas fa-calendar-alt"></i> ${item.date}`;
                    card.appendChild(date);
                }

                const readTimeSpan = document.createElement('span');
                readTimeSpan.className = 'learning-topic-read-time';
                readTimeSpan.innerHTML = `<i class="fas fa-clock"></i> ~2 min read`;
                card.appendChild(readTimeSpan);

                (async function fetchReadTime() {
                    try {
                        const rawUrl = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${BRANCH}/${filePath}`;
                        const mdResponse = await fetch(rawUrl);
                        if (mdResponse.ok) {
                            const md = await mdResponse.text();
                            const contentWithoutFrontmatter = md.replace(/^---[\s\S]*?---/, '').trim();
                            const words = contentWithoutFrontmatter.split(/\s+/).filter(w => w.length > 0).length;
                            const readTime = Math.ceil(words / 200);
                            readTimeSpan.innerHTML = `<i class="fas fa-clock"></i> ${readTime} min read`;
                        }
                    } catch {
                        // keep default
                    }
                })();

                // Share dropdown
                const dropdown = document.createElement('div');
                dropdown.className = 'share-dropdown';

                const shareBtn = document.createElement('button');
                shareBtn.className = 'share-button';
                shareBtn.setAttribute('aria-label', 'Share options');
                shareBtn.innerHTML = '<i class="fas fa-share-alt"></i>';
                dropdown.appendChild(shareBtn);

                const menu = document.createElement('div');
                menu.className = 'share-dropdown-menu';

                const shareNative = document.createElement('button');
                shareNative.className = 'share-option share-native';
                shareNative.dataset.file = filePath;
                shareNative.innerHTML = '<i class="fas fa-share-nodes"></i> Share';
                menu.appendChild(shareNative);

                const shareCopy = document.createElement('button');
                shareCopy.className = 'share-option share-copy';
                shareCopy.dataset.file = filePath;
                shareCopy.innerHTML = '<i class="fas fa-copy"></i> Copy Link';
                menu.appendChild(shareCopy);

                dropdown.appendChild(menu);
                card.appendChild(dropdown);

                // Events
                card.addEventListener('click', function (e) {
                    if (e.target.closest('.share-dropdown')) return;
                    const href = this.dataset.href;
                    if (href) window.location.href = href;
                });

                shareBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const isOpen = menu.classList.contains('open');
                    document.querySelectorAll('.share-dropdown-menu.open').forEach(m => m.classList.remove('open'));
                    if (!isOpen) menu.classList.add('open');
                });

                shareNative.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const file = this.dataset.file;
                    const url = buildViewerUrl(file);
                    if (navigator.share) {
                        navigator.share({ title: item.title || 'Learning note', url }).catch(() => { });
                    } else {
                        copyToClipboard(url, this);
                    }
                    closeAllDropdowns();
                });

                shareCopy.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const file = this.dataset.file;
                    const url = buildViewerUrl(file);
                    copyToClipboard(url, this);
                    closeAllDropdowns();
                });

                return card;
            }

            // ---- Helpers ----
            function buildViewerUrl(file) {
                const base = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/');
                return `${base}learning-viewer.html?file=${encodeURIComponent(file)}`;
            }

            function copyToClipboard(text, element) {
                navigator.clipboard.writeText(text).then(() => {
                    const orig = element.textContent;
                    element.textContent = 'Copied!';
                    setTimeout(() => { element.textContent = orig; }, 1500);
                }).catch(() => {
                    prompt('Copy this link:', text);
                });
            }

            function closeAllDropdowns() {
                document.querySelectorAll('.share-dropdown-menu.open').forEach(m => m.classList.remove('open'));
            }

            document.addEventListener('click', function () {
                closeAllDropdowns();
            });
        });
    </script>
</body>

</html>
