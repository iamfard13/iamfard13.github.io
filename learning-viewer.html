<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Learning notes — Ali Abbasifard">
    <title>Learning | Ali Abbasifard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

    <!-- =====================================================
         ANIMATED BACKGROUND – PARTICLE NETWORK
         ===================================================== -->
    <canvas id="bgCanvas"></canvas>

    <!-- =====================================================
         NAVIGATION
         ===================================================== -->
    <header class="navbar">
        <nav class="navbar-links">
            <a href="index.html#skills">Skills</a>
            <a href="index.html#projects">Projects</a>
            <a href="learning.html" class="active">Learning</a>
            <a href="index.html#recommendations">Recommendations</a>
            <a href="index.html#contact">Contact</a>
        </nav>
    </header>

    <!-- =====================================================
         VIEWER – Title first, then Chapter
         ===================================================== -->
    <main class="viewer-page" id="viewer-top">

        <a href="learning.html" class="viewer-back">
            ← BACK TO LEARNING
        </a>

        <!-- HEADER – Title first, then Chapter -->
        <header class="viewer-header">
            <h1 id="viewer-title">Loading...</h1>
            <p id="viewer-chapter" class="viewer-chapter"></p>
            <p id="viewer-date" class="viewer-date"></p>
        </header>

        <!-- =================================================
             CONTENT – solid card
             ================================================= -->
        <section class="viewer-content-wrapper" id="viewer-content-wrapper">
            <article id="viewer-content" class="viewer-content">
                <div class="learning-loading">Loading learning content...</div>
            </article>
        </section>

    </main>

    <!-- =====================================================
         FOOTER
         ===================================================== -->
    <footer class="footer">
        <p>© 2026 Ali Abbasifard</p>
        <p>Built with curiosity &amp; code.</p>
    </footer>

    <!-- Viewer JS -->
    <script src="learning-viewer.js"></script>

    <!-- Background particle network -->
    <script src="particles.js"></script>

    <!-- =====================================================
         SCROLL TO CONTENT ON LOAD
         ===================================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {
                const target = document.getElementById('viewer-content-wrapper');
                if (target) {
                    const rect = target.getBoundingClientRect();
                    const navbarHeight = 75;
                    const offset = rect.top - navbarHeight - 20;
                    if (offset < 0) {
                        window.scrollBy({
                            top: offset,
                            behavior: 'smooth'
                        });
                    }
                }
            }, 100);
        });
    </script>
</body>

</html>
